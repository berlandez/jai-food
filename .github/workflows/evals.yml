name: E.A.T. evals

on:
  push:
  pull_request:

jobs:
  eat-retrieval:
    name: E.A.T. retrieval scoreboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install eval dependencies
        run: python -m pip install -r evals/requirements.txt
      - name: Run E.A.T. offline evals
        run: |
          set -o pipefail
          python -m evals | tee scoreboard.txt
      - name: Publish E.A.T. scoreboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eat-retrieval-scoreboard
          path: scoreboard.txt
